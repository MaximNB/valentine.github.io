<!DOCTYPE html>
<html lang="rus">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Дата и Время</title>
    <link rel="stylesheet" href="css/date.css" />
  </head>
  <body>
    <h1 title="choose a date">Настя, когда ты будешь свободна?</h1>
    
    <form class="form-group" id="dateForm">
      <label>1. Выбери дату:</label>
      <div>
        <input type="date" id="dateInput" required />
      </div>

      <label style="margin-top: 15px; display: block;">2. Выбери время:</label>
      <div>
        <input type="time" id="timeInput" required />
      </div>

      <div style="margin-top: 20px;">
        <button class="button" type="submit">
          Подтвердить
        </button>
      </div>
    </form>

    <script>
      const TELEGRAM_BOT_TOKEN = "8917687742:AAE1GlmGH_Y_jD7fnQSrFOaMBVC5AsQzdwE";
      const TELEGRAM_CHAT_ID = "393863552";

      document.getElementById("dateForm").addEventListener("submit", function (e) {
        e.preventDefault();
        
        const selectedDate = document.getElementById("dateInput").value || "Не выбрано";
        const selectedTime = document.getElementById("timeInput").value || "Не выбрано";
        
        const messageText = `📅 **[Шаг 1] Выбраны дата и время:**\n📆 **Дата:** ${selectedDate}\n⏰ **Время:** ${selectedTime}`;

        fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            text: messageText,
            parse_mode: "Markdown"
          })
        }).finally(() => {
          window.location.href = "food.html";
        });
      });
    </script>
  </body>
</html>
